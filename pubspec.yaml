name: poimon_app
description: Poimon App for Flutter
version: 1.0.0+1
publish_to: none

environment:
  sdk: ^3.9.0
  flutter: ^3.35.0

dependencies:
  advertising_id: ^2.6.0
  android_intent_plus: ^5.0.1
  app_tracking_transparency: ^2.0.4
  bloc: ^9.0.1
  cached_network_image: ^3.3.1
  cached_network_svg_image: ^1.2.0
  cached_query_flutter: ^2.0.0
  collection: ^1.18.0
  webview_flutter: ^4.13.0
  debounce_throttle: ^2.0.0
  device_info_plus: ^10.0.1
  dio: ^5.4.1
  firebase_core: ^4.1.0
  formz: ^0.7.0
  firebase_messaging: ^16.0.1
  firebase_analytics: ^12.0.0
  firebase_crashlytics: ^5.0.1
  flutter:
    sdk: flutter
  flutter_native_splash: ^2.4.0
  flutter_bloc: ^9.1.1
  flutter_secure_storage: ^9.0.0
  flutter_dotenv: ^5.1.0
  flutter_launcher_icons: ^0.14.3
  animated_text_kit: ^4.2.3
  flutter_local_notifications: ^17.0.0
  flutter_svg: ^2.0.10+1
  fluttertoast: ^8.2.12
  flutter_localizations:
    sdk: flutter
  freezed_annotation: ^2.4.1
  functional_widget_annotation: ^0.10.0
  flutter_hooks: ^0.20.5
  gap: ^3.0.1
  get_it: ^7.7.0
  go_router: ^14.1.1
  google_sign_in: ^6.2.1
  in_app_review: ^2.0.6
  injectable: ^2.5.1
  intl: ^0.20.2
  json_annotation: ^4.9.0
  loader_overlay: ^4.0.0
  logger: ^2.2.0
  lottie: ^3.0.0
  package_info_plus: ^8.0.0
  permission_handler: ^11.3.1
  pretty_dio_logger: ^1.3.1
  retrofit: 4.4.1
  rxdart: ^0.27.7
  share_plus: ^10.0.1
  shared_preferences: ^2.2.2
  showcaseview: ^2.0.3
  talker: ^4.1.0
  talker_bloc_logger: ^4.1.0
  talker_dio_logger: ^4.1.0
  talker_flutter: ^4.1.0
  url_launcher: ^6.2.5
  uuid: ^4.4.0
  flutter_sticky_header: ^0.8.0
  image_picker: ^1.1.2
  geolocator: ^11.0.0
  provider: ^6.1.5
  
dev_dependencies:
  bloc_test: ^10.0.0
  build_runner: ^2.4.8
  flutter_gen_runner: 5.8.0
  flutter_test:
    sdk: flutter
  freezed: ^2.4.7
  functional_widget: ^0.10.2
  go_router_builder: ^2.6.0
  injectable_generator: ^2.6.2
  json_serializable: ^6.7.1
  mocktail: ^1.0.0
  retrofit_generator: ^8.1.0
  very_good_analysis: ^10.0.0

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/fonts/
    - assets/images/
    - assets/images/icons/
    - assets/images/illustrations/
    - assets/images/screen_shots/
    - assets/images/splash/
    - assets/animations/lottie/
    - assets/animations/gif/
    - .env.production
    - .env.development
    - .env.staging
  fonts:
    - family: JalnanGothic
      fonts:
        - asset: assets/fonts/JalnanGothic/JalnanGothic.otf
    - family: Pretendard
      fonts:
        - asset: assets/fonts/Pretendard/Pretendard-Black.ttf
          weight: 900
        - asset: assets/fonts/Pretendard/Pretendard-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Pretendard/Pretendard-Bold.ttf
          weight: 700
        - asset: assets/fonts/Pretendard/Pretendard-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Pretendard/Pretendard-Medium.ttf
          weight: 500
        - asset: assets/fonts/Pretendard/Pretendard-Regular.ttf
          weight: 400
        - asset: assets/fonts/Pretendard/Pretendard-Light.ttf
          weight: 300
        - asset: assets/fonts/Pretendard/Pretendard-ExtraLight.ttf
          weight: 200
        - asset: assets/fonts/Pretendard/Pretendard-Thin.ttf
          weight: 100
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter/Inter-Black.ttf
          weight: 900
        - asset: assets/fonts/Inter/Inter-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Inter/Inter-Bold.ttf
          weight: 700
        - asset: assets/fonts/Inter/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter/Inter-Light.ttf
          weight: 300
        - asset: assets/fonts/Inter/Inter-ExtraLight.ttf
          weight: 200
        - asset: assets/fonts/Inter/Inter-Thin.ttf
          weight: 100

flutter_gen:
  output: lib/src/presentation/common/
  integrations:
    flutter_svg: true
    lottie: true
    gif: true
  line_length: 80
  fonts:
    enabled: true
    outputs:
      class_name: FontFamily
